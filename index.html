<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ancestry Composition</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--ink:#000;--hair:#e7e7e9;--chev:#c8c8ca;--value-right:38px;--chevron-right:12px}
*{box-sizing:border-box; text-rendering:auto; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale}
html,body{margin:0;background:#eceff2;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
body{display:flex;justify-content:center}
.app{width:min(100%,480px);min-height:100vh;background:#fff;overflow:hidden;position:relative;box-shadow:0 0 24px rgba(0,0,0,.08)}
.topbar{height:67px;position:relative;background:linear-gradient(#dce1eb,#ced5e2);overflow:hidden}.topbar:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 145px 48px at 30% 104%,rgba(255,255,255,.7) 0 55%,transparent 56%),radial-gradient(ellipse 120px 48px at 86% 100%,rgba(255,255,255,.3) 0 52%,transparent 53%)}
.nav{position:relative;z-index:1;height:67px;display:grid;grid-template-columns:49px 1fr 111px;align-items:center;gap:8px;padding:7px 17px 7px 18px}.circle,.capsule{border:1px solid rgba(255,255,255,.96);background:rgba(255,255,255,.88);box-shadow:0 2px 5px rgba(0,0,0,.09)}.circle{width:49px;height:49px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer}.capsule{height:49px;border-radius:26px;display:grid;grid-template-columns:1fr 1fr}.capsule button{border:0;background:transparent;display:grid;place-items:center;padding:0;cursor:pointer}.page-title{font-size:20px;line-height:1;font-weight:600;text-align:center;white-space:nowrap;letter-spacing:-.4px}.circle svg{width:29px;height:29px}.capsule svg{width:27px;height:27px}

.profile{height:74px;position:relative;display:flex;align-items:center;justify-content:center}
.handle{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:32px;height:2px;border-radius:2px;background:#3a3a3c}
.pie{position:absolute;left:16px;top:-12px;width:81px;height:81px;border-radius:50%;filter:drop-shadow(0 2px 5px rgba(0,0,0,.15))}.pie svg{width:100%;height:100%;display:block}
.name{font-size:17px;font-weight:700;letter-spacing:-.42px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 220px);text-align:center;z-index:2}
.total{position:absolute;right:var(--value-right);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px;white-space:nowrap;z-index:2}

.band{min-height:40px;padding:0 125px 0 18px;display:flex;align-items:center;position:relative;font-size:17px;font-weight:700;letter-spacing:-.3px}.band .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.band .value{position:absolute;right:var(--value-right);top:50%;transform:translateY(-50%);width:72px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

.row{position:relative;min-height:46px;display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:4px;align-items:center;}
.row.level-1 { padding: 10px 110px 10px 14px; }
.row.level-2 { padding: 10px 110px 10px 37px; }

.detail{position:relative;padding-top:12px;padding-bottom:12px;padding-right:15px;}
.detail.level-1 { padding-left: 14px; }
.detail.level-2 { padding-left: 37px; }

.row.level-1:after, .detail.level-1:after { content:""; position:absolute; right:15px; bottom:0; height:1px; background:var(--hair); left:15px; }
.row.level-2:after, .detail.level-2:after { content:""; position:absolute; right:15px; bottom:0; height:1px; background:var(--hair); left:15px; }
.row:last-child:after, .detail:last-child:after { display: none; }

.dot{width:11px;height:11px;border-radius:50%;justify-self:start;margin-left:3px}
.label,.pct{font-size:17px;line-height:1.2;font-weight:500;letter-spacing:-.2px;color:#000}.pct{position:absolute;right:var(--value-right);top:50%;transform:translateY(-50%);width:72px;font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
.chev{position:absolute;right:var(--chevron-right);top:50%;transform:translateY(-50%);width:9px;height:14px}
.detail-head{position:relative;width:calc(100% + 15px);display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:3px;align-items:center;padding-right:110px}

.places{padding:8px 0 0 29px;font-size:13px;line-height:1.5;letter-spacing:-.1px;color:#1c1c1e;font-weight:400}
.places p{margin:0 0 10px;word-spacing:-0.5px}.places p:last-child{margin-bottom:0}.places strong{font-weight:600}

.panel{position:fixed;z-index:30;inset:8px;max-width:520px;margin:auto;background:#f7f7f9;border:1px solid #d4d4d8;border-radius:18px;box-shadow:0 16px 50px rgba(0,0,0,.28);display:none;overflow:hidden}.panel.open{display:flex;flex-direction:column}.panel-head{padding:14px 16px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}.panel-head h2{font-size:18px;margin:0}.panel-head button{border:0;background:#ececef;border-radius:9px;padding:7px 11px;font-weight:700;cursor:pointer}.panel-body{padding:12px;overflow:auto}.identity{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-bottom:12px}.field{display:grid;gap:4px;font-size:11px;color:#5c5c62}.field input,.field select,.field textarea{width:100%;border:1px solid #cfcfd4;border-radius:9px;background:#fff;padding:9px;font:inherit;color:#111}.field textarea{resize:vertical;min-height:58px}.editor-list{display:grid;gap:10px}.editor-card{background:#fff;border:1px solid #d8d8dc;border-radius:13px;padding:10px}.editor-grid{display:grid;grid-template-columns:1.4fr .7fr;gap:8px}.editor-grid .full{grid-column:1/-1}.card-actions{display:flex;gap:7px;margin-top:8px}.card-actions button,.add-btn,.apply-btn{border:0;border-radius:9px;padding:9px 10px;font-weight:700;cursor:pointer}.remove{background:#f2e7e7;color:#8a2525;flex:1}.icon-btn{background:#e9e9ed;color:#111;width:38px}.icon-btn:disabled{opacity:0.4;cursor:default}.add-btn{width:100%;margin-top:10px;background:#e9e9ed}.apply-btn{width:100%;margin-top:10px;background:#171719;color:#fff}.hint{font-size:10px;line-height:1.35;color:#666;margin:9px 2px 0}
#results section {cursor: grab; transition: opacity 0.2s ease;}
#results section:active {cursor: grabbing;}
#results section.over {border-top: 2px dashed #000; border-bottom: 2px dashed #000; opacity: 0.7;}
#results {cursor: pointer;} 

/* DB Editor Custom Styles */
.db-region { background: #fff; border: 1px solid #d8d8dc; border-radius: 11px; margin-bottom: 10px; overflow: hidden; }
.db-summary { padding: 12px; font-weight: 700; cursor: pointer; background: #fdfdfd; user-select: none; }
.db-summary:hover { background: #f7f7f9; }
.db-content { padding: 12px; border-top: 1px solid #e7e7e9; display: grid; gap: 8px; }
.db-row { display: grid; grid-template-columns: 1fr 16px 85px 30px; gap: 6px; align-items: center; }
.hex-input { border: 1px solid #cfcfd4; border-radius: 6px; padding: 6px; width: 100%; font-family: monospace; font-size: 13px; text-transform: uppercase; }
.swatch { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); display: inline-block; vertical-align: middle; }

@media(max-width:380px){:root{--value-right:34px;--chevron-right:10px}.page-title{font-size:18px}.band{font-size:17px}.band .value{font-size:17px}.label,.pct{font-size:17px}.total{font-size:17px}}
</style></head><body>
<main class="app" id="captureTarget"><header class="topbar"><div class="nav"><button class="circle" aria-label="Back"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="round" width="100%" height="100%"><path d="M15.5 4.5 8 12l7.5 7.5"/></svg></button><div class="page-title">Ancestry Composition</div><div class="capsule"><button id="downloadBtn" aria-label="Export Image"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.25" stroke-linecap="round" width="100%" height="100%"><path d="M12 15.8V3.2m-4.4 4.2L12 3l4.4 4.4M6.1 11.2H4.5v8.2h15v-8.2h-1.6"/></svg></button><button><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button></div></div></header>
<section class="profile" id="profileArea">
  <div class="handle"></div>
  <div class="pie">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="geometricPrecision" id="pieSegments"></svg>
  </div>
  <span class="name" id="nameOut"></span>
  <span class="total">100%</span>
</section>
<div id="results" title="Click anywhere to edit results"></div></main>

<aside class="panel" id="panel">
  <div class="panel-head"><h2 id="panelTitle">Customize ancestry results</h2><button id="close">Close</button></div>
  <div class="panel-body">

    <!-- STANDARD PROFILE EDITOR VIEW -->
    <div id="profileEditorView">
      <label class="field" style="margin-bottom:6px">Saved Profile
        <select id="profileSelect"></select>
      </label>
      <div class="card-actions" style="margin-top:0;margin-bottom:8px">
        <button class="icon-btn" id="newProfile" type="button" style="flex:1;width:auto">New</button>
        <button class="icon-btn" id="dupProfile" type="button" style="flex:1;width:auto">Duplicate</button>
        <button class="remove" id="delProfile" type="button" style="flex:1">Delete</button>
      </div>
      <button class="icon-btn" id="openDbBtn" type="button" style="width:100%; margin-bottom:14px; background:#d7d7dc;">⚙️ Manage Populations & Colors</button>
      <hr style="border:0;border-top:1px solid #d8d8dc;margin:0 -12px 14px">

      <div class="identity"><label class="field">Display name<input id="nameInput"></label><label class="field">Initials<input id="initialsInput" maxlength="3"></label></div>
      <div id="editorList" class="editor-list"></div>
      <button class="add-btn" id="addGroup">+ Add ancestry group</button>
      <button class="apply-btn" id="apply">Apply changes</button>
      <p class="hint">Choose from the current 23andMe ancestry hierarchy. Percentages may use decimals. Add optional recent regions as one entry per line.</p>
    </div>

    <!-- NEW DATABASE EDITOR VIEW -->
    <div id="dbEditorView" style="display:none;">
      <p class="hint" style="margin-top:0; margin-bottom:12px; font-size:12px;">Edit groups, names, and HEX colors here. Changes apply live to your results immediately!</p>
      <div id="dbList" class="editor-list"></div>
      <button id="addDbRegion" class="add-btn" style="margin-top:12px;">+ Add Broad Region</button>
      <button id="closeDbBtn" class="apply-btn" style="margin-top:12px;">Done (Return to Editor)</button>
      <button id="resetDbBtn" class="remove" style="width:100%; margin-top:12px;">Reset to 23andMe Defaults</button>
    </div>

  </div>
</aside>

<script>
// Master default catalog
const DEFAULT_CATALOG={
"European":{band:"#81c1fb",text:"#000000",groups:{
"Western European":"#3d609f",
"French":"#1c68df",
"Austrian & Southern German":"#5189e5",
"Swiss, Southwestern German & Western Austrian":"#387fe0",
"Dutch & Northern German":"#508ae5",
"Belgian, Rhinelander & Southern Dutch":"#5b72bc",
"British & Irish":"#387fe0",
"Scottish":"#6fa8ec",
"English":"#5a95e0",
"Irish":"#85b4f0",
"Welsh":"#4993ee",
"Nordic":"#44b1b5",
"Swedish":"#40d6ce",
"Finnish":"#1dcbc1",
"Scandinavian":"#54a5de",
"Danish":"#4999d2",
"Icelandic":"#5bb0e4",
"Norwegian":"#4da4d9",
"Italian & Maltese":"#3e5593",
"Southern Italian":"#2662e1",
"Northern Italian":"#3e5593",
"Greek & Balkan":"#4946a1",
"Greek":"#444de2",
"Albanian & Macedonian":"#5150d2",
"Bulgarian, Moldovan & Romanian":"#625ddf",
"Bosnian, Croatian, Montenegrin & Serbian":"#393fc5",
"Spanish & Portuguese":"#3b46be",
"Canary Islander":"#2c3cc8",
"Andalusian, Asturian & Castilian":"#5360e0",
"Aragonese & Catalan":"#2f39c0",
"Portuguese & Galician":"#4d5bdc",
"Basque":"#3945ca",
"Central & Eastern European":"#459f93",
"Belarusian, Polish & Ukrainian":"#30ceac",
"Czech, Hungarian, Slovak & Southern Polish":"#5ee3cc",
"Estonian":"#3abfb8",
"Latvian":"#56b4a1",
"Lithuanian":"#58c3a9",
"Russian":"#56b4a1",
"Ashkenazi Jewish":"#19c3e4"}},
"Central & South Asian":{band:"#a1f55a",text:"#2f3032",groups:{"Northern Indian & Pakistani":"#cbe638","Bengali & Northeast Indian":"#a8ee56","Central Asian, Northern Indian & Pakistani":"#d6e336","Central Asian":"#e2da38","Gujarati Patidar":"#cfd62d","Southern Indian Subgroup":"#3fce6a","Southern South Asian":"#82d85b","Malayali Subgroup":"#4ed7a8","Southern Indian & Sri Lankan":"#3be093","Broadly Central & South Asian":"#86c75c"}},
"Indigenous American":{band:"#f85bf3",text:"#ffffff",groups:{"North American":"#e5429b","Arctic North American":"#c728bd","Western North American":"#e626ad","Southern Mesoamerican":"#e228c6","Central Andean & Amazonian":"#e228c6","Northern Andean":"#d824bd","Indigenous American":"#18b7a8"}},
"East Asian":{band:"#fbc387",text:"#292b2e",groups:{"Chinese":"#b14339","Southern Coastal Chinese":"#ee4d3e","Northern Chinese & Tibetan":"#e83827","Southern Chinese & Taiwanese":"#f44b41","Filipino & Austronesian":"#eea236","Filipino":"#e46b3f","Indonesian, Thai, Khmer & Myanma":"#d67a4d","Vietnamese":"#df8445","Japanese":"#e54273","Korean":"#ef2424","Northern Asian":"#c6654e","Manchurian & Mongolian":"#da5c43","Siberian":"#eb6c4f","Broadly Northern Asian":"#fa8566","Broadly East Asian":"#c27766"}},
"Sub-Saharan African":{band:"#a25cf5",text:"#ffffff",groups:{"West African":"#643ecc","Nigerian":"#734be0","Senegambian & Guinean":"#643ecc","Ghanaian, Liberian & Sierra Leonean":"#734be0","Congolese & Southern East African":"#643ecc","Angolan & Congolese":"#734be0","Southern East African":"#7a52e5","African Hunter-Gatherer":"#643ecc","Northern East African":"#c53e70","Ethiopian & Eritrean":"#b83368","Sudanese":"#6819d1","Broadly Sub-Saharan African":"#da6972"}},
"Western Asian & North African":{band:"#a07cf0",text:"#ffffff",groups:{"Northern West Asian":"#443b96","Iranian, Caucasian & Mesopotamian":"#6c59e6","Arab, Egyptian & Levantine":"#5b4cdb","Egyptian & Southern Levantine":"#6553e6","Levantine":"#6553e6","Coptic Egyptian":"#796cf0","Peninsular Arab":"#6c5ce7","North African":"#604ee0","Cypriot":"#3f35cb","Anatolian":"#514bc5","Broadly Western Asian & North African":"#7768eb"}},
"Melanesian":{band:"#6bd5e8",text:"#173237",groups:{"Melanesian":"#25b8d3"}}
};

const DEFAULT_PROFILE=[
{top:"Western Asian & North African",group:"Iranian, Caucasian & Mesopotamian",pct:49.3,level:1,regions:[]},
{top:"East Asian",group:"Manchurian & Mongolian",pct:34.5,level:1,regions:[]},
{top:"East Asian",group:"Southern Chinese & Taiwanese",pct:7.2,level:1,regions:[]},
{top:"Central & South Asian",group:"Northern Indian & Pakistani",pct:5.0,level:1,regions:[]},
{top:"Central & South Asian",group:"Bengali & Northeast Indian",pct:2.0,level:1,regions:[]},
{top:"European",group:"Finnish",pct:1.5,level:1,regions:[]},
{top:"Melanesian",group:"Melanesian",pct:0.5,level:1,regions:[]}
];

// STATE MANAGEMENT
let currentCatalog = JSON.parse(localStorage.getItem('ancestryCatalog')) || structuredClone(DEFAULT_CATALOG);
let profiles = [];
let currentProfileIndex = 0;
let editCat = []; 

try {
  const savedProfiles = localStorage.getItem('ancestryProfiles');
  if (savedProfiles) {
    profiles = JSON.parse(savedProfiles);
    currentProfileIndex = parseInt(localStorage.getItem('ancestryCurrentIndex') || '0', 10);
    if (currentProfileIndex >= profiles.length || isNaN(currentProfileIndex)) currentProfileIndex = 0;
  } else {
    profiles = [{name:"Alex Miller", initials:"AM", items:structuredClone(DEFAULT_PROFILE)}];
  }
} catch(e) {
  profiles = [{name:"Alex Miller", initials:"AM", items:structuredClone(DEFAULT_PROFILE)}];
}

let state = profiles[currentProfileIndex];

function saveState() {
  localStorage.setItem('ancestryProfiles', JSON.stringify(profiles));
  localStorage.setItem('ancestryCurrentIndex', currentProfileIndex.toString());
}

function syncInputsToState() {
  state.name = document.querySelector('#nameInput').value.trim() || 'Sample User';
  state.initials = document.querySelector('#initialsInput').value.trim() || state.name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
}

function updateProfileUI() {
  document.querySelector('#profileSelect').innerHTML = profiles.map((p, i) => `<option value="${i}"${i===currentProfileIndex?' selected':''}>${esc(p.name || 'Unnamed Profile')}</option>`).join('');
  document.querySelector('#delProfile').disabled = profiles.length <= 1;
  document.querySelector('#delProfile').style.opacity = profiles.length <= 1 ? '0.4' : '1';
}

const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>`${Number(n||0).toFixed(1)}%`;

// MAIN RENDER ENGINE
function render(){
 document.querySelector('#nameOut').textContent=state.name;
 let html='';
 const orderedTops = [...new Set(state.items.map(x=>x.top))];
 
 for(const top of orderedTops){
   const rows = state.items.filter(x=>x.top===top);
   if(!rows.length)continue;
   
   const meta = currentCatalog[top] || {band:"#cccccc", text:"#ffffff", groups:{}};
   
   const level1Rows = rows.filter(r => parseInt(r.level, 10) === 1);
   let bandTotal = 0;
   
   if (level1Rows.length > 0) {
       bandTotal = level1Rows.reduce((sum, r) => sum + parseFloat(r.pct || 0), 0);
   } else {
       bandTotal = Math.max(0, ...rows.map(r => parseFloat(r.pct || 0)));
   }

   html+=`<section draggable="true" data-top="${esc(top)}"><div class="band" style="background:${meta.band};color:${meta.text}"><span class="title">${esc(top)}</span><span class="value">${fmt(bandTotal)}</span></div>`;
   for(const r of rows){
       const color = meta.groups[r.group] || meta.band || "#888888";
       const chev='<img class="chev" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4IDE0IiBmaWxsPSJub25lIiBzdHJva2U9IiNjN2M3Y2MiIHN0cm9rZS13aWR0aD0iMS41IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxwYXRoIGQ9Ik0xIDFsNiA2LTYgNiIvPjwvc3ZnPg==" alt="">';
       const lvl = parseInt(r.level, 10) || 1;
       
       if(!r.regions.length){
           html+=`<div class="row level-${lvl}"><span class="dot" style="background:${color}"></span><span class="label">${esc(r.group)}</span><span class="pct">${fmt(r.pct)}</span>${chev}</div>`
       } else {
           html+=`<div class="detail level-${lvl}"><div class="detail-head"><span class="dot" style="background:${color}"></span><span class="label">${esc(r.group)}</span><span class="pct">${fmt(r.pct)}</span>${chev}</div><div class="places">${r.regions.map((v,idx)=>{
             const cleanV = v.trim().replace(/\s+/g, ' ');
             const p = cleanV.split(',');
             return `<p>${idx<2&&p.length>1?`<strong>${esc(p[0].trim())}</strong>, ${esc(p.slice(1).join(',').trim())}`:esc(cleanV)}</p>`
           }).join('')}</div></div>`
       }
   }
   html+='</section>'
 }
 document.querySelector('#results').innerHTML=html;
 renderPie();

 document.querySelectorAll('#results section').forEach(sec => {
   const top = sec.dataset.top;
   sec.ondragstart = e => { e.dataTransfer.setData('text/plain', top); sec.style.opacity = '0.5'; };
   sec.ondragover = e => { e.preventDefault(); sec.classList.add('over'); };
   sec.ondragleave = e => { sec.classList.remove('over'); };
   sec.ondrop = e => {
     e.preventDefault();
     sec.classList.remove('over');
     const draggedTop = e.dataTransfer.getData('text/plain');
     if(draggedTop && draggedTop !== top) {
       const draggedItems = state.items.filter(x => x.top === draggedTop);
       state.items = state.items.filter(x => x.top !== draggedTop);
       const insertIdx = state.items.findIndex(x => x.top === top);
       if(insertIdx >= 0) state.items.splice(insertIdx, 0, ...draggedItems);
       else state.items.push(...draggedItems);
       saveState();
       render();
     }
   };
   sec.ondragend = () => { sec.style.opacity = '1'; document.querySelectorAll('#results section').forEach(s => s.classList.remove('over')); };
 });
}

function renderPie(){
  const rIn = 32.5, cIn = 2 * Math.PI * rIn; 
  const rOut = 35.5, cOut = 2 * Math.PI * rOut; 
  
  let offsetIn = 0, offsetOut = 0;
  let innerPaths = '', outerPaths = '';
  
  const orderedTops = [...new Set(state.items.map(x => x.top))];
  
  for(const top of orderedTops){
    const rowsForTop = state.items.filter(x => x.top === top);
    const l1Rows = rowsForTop.filter(r => parseInt(r.level, 10) === 1);
    
    let bandAmt = l1Rows.length > 0 ? l1Rows.reduce((sum, r) => sum + parseFloat(r.pct || 0), 0) : Math.max(0, ...rowsForTop.map(r => parseFloat(r.pct || 0)));
    
    if(bandAmt > 0) {
      const dashIn = (cIn * bandAmt) / 100;
      const bleedIn = (bandAmt < 100 && bandAmt > 0) ? 1.2 : 0;
      const meta = currentCatalog[top] || {band:"#cccccc", groups:{}};
      
      innerPaths += `<circle cx="50" cy="50" r="${rIn}" fill="none" stroke="${meta.band}" stroke-width="28" stroke-dasharray="${dashIn + bleedIn} ${cIn}" stroke-dashoffset="-${offsetIn}"/>`;
      offsetIn += dashIn;
      
      let outerSegments = [];
      for (let i = 0; i < rowsForTop.length; i++) {
        const r = rowsForTop[i];
        const lvl = parseInt(r.level, 10) || 1;
        
        if (lvl === 1) {
          let childSum = 0;
          let children = [];
          let j = i + 1;
          
          while (j < rowsForTop.length && (parseInt(rowsForTop[j].level, 10) || 1) === 2) {
            children.push(rowsForTop[j]);
            childSum += parseFloat(rowsForTop[j].pct || 0);
            j++;
          }
          
          if (children.length > 0) {
            outerSegments.push(...children);
            let diff = parseFloat(r.pct || 0) - childSum;
            if (diff > 0.05) outerSegments.push({ group: r.group, pct: diff });
            i = j - 1; 
          } else {
            outerSegments.push(r);
          }
        } else if (lvl === 2) {
           outerSegments.push(r);
        }
      }

      for(const seg of outerSegments) {
        const amt = Math.max(0, Number(seg.pct || 0));
        if(amt > 0) {
          const dashOut = (cOut * amt) / 100;
          const bleedOut = (amt < 100 && amt > 0) ? 1.2 : 0;
          const color = meta.groups[seg.group] || meta.band || "#888888";
          outerPaths += `<circle cx="50" cy="50" r="${rOut}" fill="none" stroke="${color}" stroke-width="22" stroke-dasharray="${dashOut + bleedOut} ${cOut}" stroke-dashoffset="-${offsetOut}"/>`;
          offsetOut += dashOut;
        }
      }
    }
  }

  let svg = '';
  svg += `<circle cx="50" cy="50" r="48.5" fill="#fff"/>`;
  svg += `<g transform="rotate(-90 50 50)">${innerPaths}${outerPaths}</g>`;
  svg += `<circle cx="50" cy="50" r="18" fill="#ebebeb" stroke="#fff" stroke-width="2"/>`;
  svg += `<text id="initials" x="50" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="400" font-size="17.5" fill="#606060" letter-spacing="0.2">${state.initials}</text>`;

  document.querySelector('#pieSegments').innerHTML = svg;
}

// PROFILE EDITOR LOGIC
function optionList(obj,selected){return Object.keys(obj).map(v=>`<option${v===selected?' selected':''}>${esc(v)}</option>`).join('')}
function renderEditor(){
 updateProfileUI();
 document.querySelector('#nameInput').value=state.name;
 document.querySelector('#initialsInput').value=state.initials;
 document.querySelector('#editorList').innerHTML=state.items.map((it,i)=> {
   const topOptions = optionList(currentCatalog, it.top);
   const gObj = currentCatalog[it.top] ? currentCatalog[it.top].groups : {};
   const groupOptions = optionList(gObj, it.group);
   
   return `<div class="editor-card" data-i="${i}" draggable="true"><div class="editor-grid"><label class="field full">Global population<select class="topSel">${topOptions}</select></label><label class="field full">Population group<select class="groupSel">${groupOptions}</select></label><label class="field">Percentage<input class="pctInput" type="number" min="0" max="100" step="0.1" value="${it.pct}"></label><label class="field">Hierarchy<select class="levelSel"><option value="1"${parseInt(it.level,10)===1?' selected':''}>Parent row</option><option value="2"${parseInt(it.level,10)===2?' selected':''}>Nested row</option></select></label><label class="field full">Recent regions (optional, one per line)<textarea class="regionsInput">${esc(it.regions.join('\n'))}</textarea></label></div><div class="card-actions"><button class="icon-btn move-up" type="button" ${i===0?'disabled':''}>↑</button><button class="icon-btn move-down" type="button" ${i===state.items.length-1?'disabled':''}>↓</button><button class="remove" type="button">Remove</button></div></div>`
 }).join('');
 
 let dragSrc = null;
 document.querySelectorAll('.editor-card').forEach(card=>{const i=+card.dataset.i;
   card.ondragstart=e=>{dragSrc=i;e.dataTransfer.effectAllowed='move';card.style.opacity='0.4'};
   card.ondragover=e=>{e.preventDefault();return false};
   card.ondragenter=e=>{card.classList.add('over')};
   card.ondragleave=e=>{card.classList.remove('over')};
   card.ondrop=e=>{e.stopPropagation();if(dragSrc!==null&&dragSrc!==i){const moved=state.items.splice(dragSrc,1)[0];state.items.splice(i,0,moved);renderEditor()}return false};
   card.ondragend=e=>{card.style.opacity='1';document.querySelectorAll('.editor-card').forEach(c=>c.classList.remove('over'))};
   card.querySelector('.topSel').onchange=e=>{state.items[i].top=e.target.value;state.items[i].group=Object.keys(currentCatalog[e.target.value].groups)[0]||'';renderEditor()};
   card.querySelector('.groupSel').onchange=e=>state.items[i].group=e.target.value;
   card.querySelector('.pctInput').oninput=e=>state.items[i].pct=Number(e.target.value);
   card.querySelector('.levelSel').onchange=e=>state.items[i].level=Number(e.target.value);
   card.querySelector('.regionsInput').oninput=e=>state.items[i].regions=e.target.value.split(/\n/).map(x=>x.trim()).filter(Boolean);
   if(card.querySelector('.move-up')) card.querySelector('.move-up').onclick=()=>{ [state.items[i-1], state.items[i]] = [state.items[i], state.items[i-1]]; renderEditor(); };
   if(card.querySelector('.move-down')) card.querySelector('.move-down').onclick=()=>{ [state.items[i], state.items[i+1]] = [state.items[i+1], state.items[i]]; renderEditor(); };
   card.querySelector('.remove').onclick=()=>{state.items.splice(i,1);renderEditor()}
 })
}

  saveState();

  render();
};

  state = profiles[currentProfileIndex];
  saveState();
  renderEditor();

};

    }

document.querySelector('#downloadBtn').onclick = async () => {
  const canvas = await html2canvas(document.querySelector('#captureTarget'), { 
    scale: 4, 
    useCORS: true, 
    backgroundColor: '#fff',
    onclone: (clonedDoc) => {
      // OVERRIDE: Swaps out Apple System fonts strictly during the image clone to prevent html2canvas kerning/overlapping bugs.
      const style = clonedDoc.createElement('style');
      style.innerHTML = '* { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif !important; }';
      clonedDoc.head.appendChild(style);
    }
  });
  
  canvas.toBlob(async (blob) => {
    if (navigator.share) {
      const file = new File([blob], 'Ancestry-Composition.jpg', { type: 'image/jpeg' });
      try { await navigator.share({ files: [file], title: 'Ancestry Composition' }); } catch (err) {}
    } else {
      const link = document.createElement('a');
      link.download = 'Ancestry-Composition.jpg';
      link.href = URL.createObjectURL(blob);
      link.click();
    }
  }, 'image/jpeg', 1.0);
};

// ==========================================
// REACTIVE DATABASE EDITOR LOGIC
// ==========================================

function catToEditArr(cat) {
  return Object.keys(cat).map(k => ({
    id: k, name: k, band: cat[k].band, text: cat[k].text,
    groups: Object.keys(cat[k].groups).map(g => ({ id: g, name: g, color: cat[k].groups[g] }))
  }));
}

function editArrToCat(arr) {
  let out = {};
  arr.forEach(r => {
    if(!r.name.trim()) return;
    let gOut = {};
    r.groups.forEach(g => { if(g.name.trim()) gOut[g.name.trim()] = g.color; });
    out[r.name.trim()] = { band: r.band, text: r.text || '#ffffff', groups: gOut };
  });
  return out;
}

function updateProfileNames(key, oldVal, newVal) {
   if(oldVal === newVal || !newVal.trim()) return;
   profiles.forEach(prof => {
      prof.items.forEach(item => {
         if(item[key] === oldVal) item[key] = newVal;
      });
   });
   saveState();
}

function renderDb() {
  document.querySelector('#dbList').innerHTML = editCat.map((reg, r) => `
    <details class="db-region">
      <summary class="db-summary">${esc(reg.name) || 'Unnamed Region'} (✏️ Click to edit)</summary>
      <div class="db-content">
        <div style="display:flex; gap:6px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px dashed #cfcfd4; align-items:center;">
          <input value="${esc(reg.name)}" class="r-name" data-r="${r}" style="flex:1; border:1px solid #cfcfd4; border-radius:6px; padding:6px;" placeholder="Region Name">
          <span class="swatch" style="background:${esc(reg.band)}"></span>
          <input type="text" value="${esc(reg.band)}" class="r-band hex-input" data-r="${r}" placeholder="#Hex" maxlength="7">
          <button type="button" class="del-r remove" data-r="${r}" style="padding:6px 10px; border-radius:6px;">X</button>
        </div>
        ${reg.groups.map((grp, g) => `
          <div class="db-row">
             <input value="${esc(grp.name)}" class="g-name" data-r="${r}" data-g="${g}" style="border:1px solid #cfcfd4; border-radius:6px; padding:6px;" placeholder="Group Name">
             <span class="swatch" style="background:${esc(grp.color)}"></span>
             <input type="text" value="${esc(grp.color)}" class="g-color hex-input" data-r="${r}" data-g="${g}" placeholder="#Hex" maxlength="7">
             <button type="button" class="del-g remove" data-r="${r}" data-g="${g}" style="padding:6px 10px; border-radius:6px;">X</button>
          </div>
        `).join('')}
        <button type="button" class="add-g add-btn" data-r="${r}">+ Add Group</button>
      </div>
    </details>
  `).join('');
}

document.querySelector('#openDbBtn').onclick = () => {
  editCat = catToEditArr(currentCatalog);
  renderDb();
  document.querySelector('#panelTitle').textContent = "Database Editor";
  document.querySelector('#profileEditorView').style.display = 'none';
  document.querySelector('#dbEditorView').style.display = 'block';
};

document.querySelector('#closeDbBtn').onclick = () => {
  document.querySelector('#panelTitle').textContent = "Customize ancestry results";
  document.querySelector('#dbEditorView').style.display = 'none';
  document.querySelector('#profileEditorView').style.display = 'block';
  renderEditor();
};

document.querySelector('#resetDbBtn').onclick = () => {
  if (confirm("Reset the entire population database to 23andMe defaults? All custom regions and colors will be lost.")) {
    currentCatalog = structuredClone(DEFAULT_CATALOG);
    localStorage.setItem('ancestryCatalog', JSON.stringify(currentCatalog));
    editCat = catToEditArr(currentCatalog);
    renderDb();
    render();
  }
};

document.querySelector('#addDbRegion').onclick = () => {
  let newName = 'New Broad Region';
  editCat.push({id: newName, name: newName, band: '#cccccc', text: '#ffffff', groups: [{id: 'New Group', name: 'New Group', color: '#888888'}]});
  currentCatalog = editArrToCat(editCat);
  localStorage.setItem('ancestryCatalog', JSON.stringify(currentCatalog));
  renderDb();
};

// LIVE REACTIVE UPDATE ENGINE
document.querySelector('#dbList').addEventListener('input', (e) => {
  const trg = e.target;
  const r = trg.dataset.r, g = trg.dataset.g;
  
  if (trg.classList.contains('r-name')) {
     updateProfileNames('top', editCat[r].id, trg.value);
     editCat[r].name = trg.value;
     editCat[r].id = trg.value;
  }
  if (trg.classList.contains('r-band')) {
     editCat[r].band = trg.value;
     trg.previousElementSibling.style.background = trg.value;
  }
  if (trg.classList.contains('g-name')) {
     updateProfileNames('group', editCat[r].groups[g].id, trg.value);
     editCat[r].groups[g].name = trg.value;
     editCat[r].groups[g].id = trg.value;
  }
  if (trg.classList.contains('g-color')) {
     editCat[r].groups[g].color = trg.value;
     trg.previousElementSibling.style.background = trg.value;
  }
  
  // Rebuild catalog and instantly update the live chart preview
  currentCatalog = editArrToCat(editCat);
  localStorage.setItem('ancestryCatalog', JSON.stringify(currentCatalog));
  render(); 
});

document.querySelector('#dbList').addEventListener('click', (e) => {
  const trg = e.target;
  const r = trg.dataset.r, g = trg.dataset.g;
  let changed = false;
  if (trg.classList.contains('del-r')) {
    if(confirm("Delete this broad region and all its sub-groups?")) { editCat.splice(r, 1); changed = true; }
  } else if (trg.classList.contains('del-g')) {
    editCat[r].groups.splice(g, 1); changed = true;
  } else if (trg.classList.contains('add-g')) {
    editCat[r].groups.push({id: 'New Group', name: 'New Group', color: '#888888'}); changed = true;
  }
  
  if (changed) {
     currentCatalog = editArrToCat(editCat);
     localStorage.setItem('ancestryCatalog', JSON.stringify(currentCatalog));
     renderDb();
     render();
  }
});

render();
</script></body></html>
